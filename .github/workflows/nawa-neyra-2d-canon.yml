name: NAWA / Neyra canon 2D — scope and integrity
on:
  push:
    branches:
      - wip/nawa-neyra-2d-canon-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-and-integration-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify Neyra-only placement and approved identity references
        run: node scripts/check-neyra-2d-canon.mjs
