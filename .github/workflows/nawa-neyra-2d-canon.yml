name: NAWA / Neyra 2D canon preview — isolated QA
on:
  push:
    branches:
      - wip/nawa-neyra-2d-canon-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: NAWA tests
        run: npm test
